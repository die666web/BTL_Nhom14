; ESP32 web OTA cho STM32F103 — Lê Trọng Mạnh
; Mở THƯ MỤC esp32/ này trong VS Code + PlatformIO (không mở cả repo).
;   Build + nạp code:      pio run -t upload
;   Nạp giao diện web:     pio run -t uploadfs     (đưa data/ vào LittleFS)
;   Xem log:               pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev            ; ESP32-WROOM-32 DevKit. Đổi nếu dùng board khác.
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv   ; app 1.2 MB + FS ~1.4 MB, dư cho file STM32 <= 55 KiB
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
